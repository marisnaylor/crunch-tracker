name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # deploy-pages@v4 queries the artifact index ~0.5s after upload finalizes.
      # That index is eventually consistent, so the lookup returned "Found 0
      # artifact(s)" on roughly half of all runs. Wait for it to settle.
      - name: Let the artifact index settle
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
